services:
  db:
    image: postgres:15-alpine
    container_name: job_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tatev1234
      POSTGRES_DB: JobDB
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d JobDB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  backend:
    build: .
    container_name: job_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DOCKER_API_VERSION=1.44

      - DATABASE_URL=postgres://postgres:tatev1234@db:5432/JobDB?sslmode=disable
    ports:
      - "8088:8088"
      - "8080:8080"
      - "8070:8070"
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: job_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://backend:8080/api
    ports:
      - "80:80"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge